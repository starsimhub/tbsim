project:
  type: website
  pre-render: python quarto_utils.py pre
  post-render: python quarto_utils.py post
  output-dir: _site
  title: "TBsim"
  execute-dir: file
  resources:
    - objects.json
    - objects.inv

website:
  title: "TBsim"
  image: /assets/tbsim-logo.png
  favicon: /assets/favicon.ico

  repo-url: https://github.com/starsimhub/tbsim
  repo-actions: [issue]
  page-navigation: true
  search:
    type: overlay

  page-footer:
    center: "Docs built for TBsim v{{< var version >}} ({{< var versiondate >}}).<br>© 2023–2026, Gates Foundation and collaborators. All rights reserved. [Privacy and Cookies Notice](https://www.gatesfoundation.org/Privacy-and-Cookies-Notice) | [Terms of Use](https://www.gatesfoundation.org/Terms-of-Use)"
    right:
      - icon: github
        href: https://github.com/starsimhub/tbsim
        aria-label: GitHub
      - icon: envelope-at-fill
        href: mailto:info@starsim.org
      - icon: slack
        href: https://starsim-idm.slack.com
      - icon: globe
        href: https://starsim.org/

  navbar:
    logo: /assets/tbsim-logo.png
    title: false
    collapse-below: lg

    tools:
      - icon: github
        href: https://github.com/starsimhub/tbsim
      - icon: envelope-at-fill
        href: mailto:info@starsim.org
      - icon: slack
        href: https://starsim-idm.slack.com
      - icon: globe
        href: https://starsim.org

    left:
      - href: index.md
        text: Home
      - href: whatsnew.md
        text: What's new
      - href: tutorials/index.md
        text: Tutorials
      - href: user_guide/index.md
        text: User guide
      - href: user_guide/examples.qmd
        text: Examples
      - href: api/index.qmd
        text: API reference

  sidebar:
    - id: main
      collapse-level: 3
      contents:
        - href: index.md
          text: "**Home**"
        - href: whatsnew.md
          text: "**What's new**"
        - href: user_guide/installation.qmd
          text: "**Installation**"
        - href: user_guide/quickstart.qmd
          text: "**Quick start**"
        - section: "**Tutorials**"
          contents:
            - href: tutorials/index.md
              text: "Overview"
            - tutorials/tuberculosis_sim.qmd
            - tutorials/tb_interventions_tutorial.qmd
            - tutorials/run_tbhiv_scens.qmd
            - tutorials/tbhiv_comorbidity.qmd
            - tutorials/malnutrition_tutorial.qmd
            - tutorials/comprehensive_analyzer_plots_example.qmd
            - tutorials/resistance_tutorial.qmd
        - section: "**User guide**"
          contents:
            - href: user_guide/index.md
              text: "Overview"
            - href: user_guide/resistance.qmd
              text: "Drug resistance"
        - href: user_guide/examples.qmd
          text: "**Examples**"
        - href: user_guide/scripts.qmd
          text: "**Scripts**"
        - href: api/index.qmd
          text: "**API reference**"
        - href: contributing.md
          text: "**Contributing**"
        - href: code_of_conduct.md
          text: "**Code of conduct**"
    - id: api
      collapse-level: 2
      contents:
        - href: index.md
          text: "**Home**"
        - href: api/index.qmd
          text: "**API reference**"
        - section: "**Core**"
          contents:
            - api/sim.qmd
            - api/tb.qmd
            - api/resistance.qmd
            - api/models.qmd
            - api/networks.qmd
            - api/analyzers.qmd
            - api/plots.qmd
        - section: "**Interventions**"
          contents:
            - text: care
              href: api/interventions.care.qmd
            - text: prevention
              href: api/interventions.prevention.qmd
        - section: "**Comorbidities**"
          contents:
            - text: hiv
              href: api/comorbidities.hiv.qmd
            - text: malnutrition
              href: api/comorbidities.malnutrition.qmd
        - section: "**Compartmental**"
          contents:
            - text: lshtm_ode
              href: api/compartmental.lshtm_ode.qmd
            - text: two_strain_ode
              href: api/compartmental.two_strain_ode.qmd

quartodoc:
  package: tbsim
  title: API reference
  style: pkgdown
  dir: api
  parser: google
  render_interlinks: true
  sections:
    - title: Core
      desc: The TB model, drug resistance, and the sim.
      contents:
        - sim
        - tb
        - resistance
        - models
        - networks
        - analyzers
        - plots
    - title: Interventions
      desc: Diagnosis, treatment, and prevention.
      contents:
        - interventions.care
        - interventions.prevention
    - title: Comorbidities
      desc: HIV and malnutrition.
      contents:
        - comorbidities.hiv
        - comorbidities.malnutrition
    - title: Compartmental
      desc: The reference ODEs.
      contents:
        - compartmental.lshtm_ode
        - compartmental.two_strain_ode

format:
  html:
    theme:
      light: [cosmo, ./assets/styles-light.scss]
      dark: [cosmo, ./assets/styles-dark.scss]
    css: ./assets/styles.css
    toc: true
    toc-expand: true
    toc-depth: 5
    highlight-style: github

filters:
  - interlinks

interlinks:
  fast: false
  sources:
    python:
      url: https://docs.python.org/3/
    numpy:
      url: https://numpy.org/doc/stable/
    pandas:
      url: https://pandas.pydata.org/pandas-docs/stable/
    scipy:
      url: https://docs.scipy.org/doc/scipy/
    matplotlib:
      url: https://matplotlib.org/stable/
    sciris:
      url: https://docs.sciris.org/
    starsim:
      url: https://docs.starsim.org/
  autolink: true
  aliases:
    numpy: [np]
    pandas: [pd]
    matplotlib: [plt]
    sciris: [sc]
    starsim: [ss]

execute:
  freeze: auto
  cache: true
  error: false
  echo: true
  warning: true
