name: Publish TBsim docs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, so page timestamps are accurate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          key: pip-${{ runner.os }}-${{ hashFiles('**/pyproject.toml') }}
          path: ~/.cache/pip

      - name: Install TBsim and docs dependencies
        run: |
          pip install -e .[dev]

      - name: Restore freeze cache  # skip re-executing notebooks whose source is unchanged
        uses: actions/cache@v4
        with:
          path: _freeze/
          key: freeze-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('tutorials/**/*.qmd', 'user_guide/**/*.qmd') }}
          restore-keys: |
            freeze-${{ hashFiles('**/pyproject.toml') }}-
            freeze-

      - name: Pre-build font cache  # so it doesn't appear in notebook output
        run: python -c "import tbsim"

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Build docs
        run: great-docs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: great-docs/_site
          include-hidden-files: true

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
